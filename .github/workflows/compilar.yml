name: Compilar firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # O arduino-cli exige que a pasta do sketch tenha o mesmo nome do .ino
      - name: Preparar pasta do sketch
        run: mkdir Nivel && cp *.ino *.h Nivel/

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32doit-devkit-v1
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: Adafruit SSD1306
            - name: Adafruit GFX Library
            - name: PubSubClient
          sketch-paths: |
            - Nivel
          enable-warnings-report: true
